name: Agent branch lifecycle

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-branch-lifecycle.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve merged agent branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            merged="$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")"
            [[ "$merged" == "true" ]] || exit 0
            branch="$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")"
            sha="$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"
          else
            row="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=20" --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("agent/")))] | first | [.head.ref, .merge_commit_sha] | @tsv')"
            [[ -n "$row" ]] || exit 0
            IFS=$'\t' read -r branch sha <<< "$row"
          fi

          [[ "$branch" == agent/* ]] || exit 0
          tag="${branch#agent/}"
          tag="${tag//\//-}"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag and delete merged branch
        if: steps.target.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
          SHA: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.target.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$existing" != "$SHA" ]]; then
              echo "::error::Tag ${TAG} already exists at ${existing}, expected ${SHA}."
              exit 1
            fi
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SHA}" >/dev/null
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null
          fi

          echo "Finalized ${BRANCH}: tag ${TAG} -> ${SHA}; merged branch removed."
