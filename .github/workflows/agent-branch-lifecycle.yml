# Finalize merged agent/* branches by tagging the merge commit and removing the branch.
name: Agent branch lifecycle

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-branch-lifecycle.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Tag merges and remove merged agent branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          finalize_branch() {
            local branch="$1"
            local sha="$2"
            local tag

            [[ "$branch" == agent/* ]] || return 0
            [[ -n "$sha" && "$sha" != "null" ]] || return 0

            tag="${branch#agent/}"
            tag="${tag//\//-}"

            if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
              if [[ "$existing" != "$sha" ]]; then
                echo "::error::Tag ${tag} already exists at ${existing}, expected ${sha}."
                return 1
              fi
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" >/dev/null
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            fi

            echo "Finalized ${branch}: tag ${tag} -> ${sha}; merged branch removed if present."
          }

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            merged="$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")"
            [[ "$merged" == "true" ]] || exit 0
            finalize_branch \
              "$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")" \
              "$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"
          else
            while IFS=$'\t' read -r branch sha; do
              [[ -n "$branch" ]] || continue
              finalize_branch "$branch" "$sha"
            done < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" \
                --jq '.[] | select(.merged_at != null and (.head.ref | startswith("agent/"))) | [.head.ref, .merge_commit_sha] | @tsv'
            )
          fi
